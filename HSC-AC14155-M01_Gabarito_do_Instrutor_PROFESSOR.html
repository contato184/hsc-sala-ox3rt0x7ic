:root{
  --navy:#001372; --navy-2:#000B4A; --night:#060B2E; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#C3C8D2; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#001372; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido — HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

body{background:#F4F6FC;color:var(--ink)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy-2) 0%,var(--navy) 100%);color:#fff;padding:24px 0 34px}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:min(46%,760px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.hero .wrapc{position:relative}
.wrapc{max-width:1120px;margin:0 auto;padding:0 20px}
.hero .bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero .bar img{height:22px}
.hero .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.hero .bar span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero .bar .badge{margin-left:auto;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.hero .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;font-weight:600;margin:10px 0 6px;line-height:1.15}
.hero .sub{font-size:18px;opacity:.9}
.hero .seals{display:flex;gap:14px;margin-top:18px;align-items:center}
.hero .seals img{height:58px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding:24px 0 70px}
.toc{position:sticky;top:14px;align-self:start;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:12px;max-height:calc(100vh - 28px);overflow:auto}
.toc h4{margin:4px 8px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.toc a:hover{background:var(--ice)}
.toc a.on{background:var(--navy);color:#fff}
.toc a b{font-size:11px;min-width:26px;color:var(--accent)}
.toc a.on b{color:#9DB1FF}
.toc a .dn{margin-left:auto;color:var(--ok);font-size:12px}
.page{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:30px 36px;min-width:0}
.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.prof .opt{cursor:default}
.navx{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 30px;line-height:1.6}
footer img{height:18px;display:block;margin:0 auto 8px}
@media (max-width:860px){ .layout{grid-template-columns:1fr} .toc{position:static;max-height:none} .page{padding:20px 16px} .hero h1{font-size:25px} }
.footbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:30;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body{padding-bottom:44px}
.wm{bottom:7px!important}

const SECS=[{"id": "s0", "kicker": "AVALIAÇÃO CLÍNICA ISO 14155", "title": "Apresentação", "ex": null, "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">AVALIAÇÃO CLÍNICA <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155</a></span></p><p style=\"margin-bottom:8.2px\"><span style=\"font-weight:700;font-size:27.2px;color:#001372\">Módulo 1: conceitos fundamentais e princípios gerais</span></p><p style=\"margin-bottom:16.3px\"><span style=\"font-weight:700;font-size:19.0px;color:#001372\">Gabarito do instrutor</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Base: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>; <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>; <a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>; <a class=\"hot\" data-refs=\"cfr-807\">21 CFR 807</a>, 814 e 888; <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>. O curso explica o que a norma exige e como o avaliador verifica; não cobre a elaboração de documentação.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Uso exclusivo do instrutor. Mesmos exercícios do Caderno, com respostas de referência e o gabarito da avaliação objetiva.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Material de uso exclusivo para treinamento da HSC Global Group. É proibida a reprodução, total ou parcial, por qualquer meio, sem autorização prévia e por escrito. Todos os direitos reservados à HSC Global Group, conforme registro no INPI.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Nos exercícios abertos, a resposta de referência não é a única redação correta. Corrija pela justificativa: regra, artigo e fonte. Quando houver mais de uma resposta defensável, o gabarito indica o que aceitar.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Índice de exercícios</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:7.26%\"><col style=\"width:34.24%\"><col style=\"width:11.41%\"><col style=\"width:20.11%\"><col style=\"width:26.98%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:11.6px;color:#6E7480\">Nº</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">EXERCÍCIO</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">BLOCO</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">MODO E TEMPO</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">NO DECK</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0p 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   20 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se a classe declarada de três dispositivos se sustenta pela regra aplicável no Brasil e na UE.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Antes de olhar a ARCA-H, a equipe de avaliação revisa três dispositivos de outros fabricantes: um cateter venoso central de curto prazo, uma bomba de infusão de medicamentos e um stent coronário farmacológico. Para cada um, o fabricante declarou uma classe; você confere a regra que decide.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Qual é a classe do cateter venoso central de curto prazo no Brasil e na UE, e qual regra decide?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. De que depende a classe da bomba de infusão de medicamentos, e qual a regra?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Qual é a classe do stent coronário farmacológico no Brasil e na UE, e por quais regras?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Onde as classes do Brasil e da UE coincidem em número e onde divergem? Por quê?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Brasil: Classe IV; UE: Classe III. Decide a Regra 7 (invasivo cirúrgico de curto prazo destinado especificamente a uso em contato direto com o sistema circulatório central), que leva à classe mais alta da regra em cada sistema (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Anexo I, Regra 7; <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo VIII, Regra 7). O avaliador confere se a duração declarada é de curto prazo; acima de 30 dias, aplica-se a Regra 8, com o mesmo resultado.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Da natureza do medicamento e do modo de administração (Regra 12, dispositivos ativos que administram medicamento). Em regra, Classe II no Brasil (IIa na UE); se a administração for potencialmente perigosa, Classe III no Brasil (IIb na UE). O avaliador espera ver o racional do risco do medicamento (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Anexo I, Regra 12).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Brasil: Classe IV; UE: Classe III. Regra 8 (contato com o sistema circulatório central e administração de medicamento) e Regra 14 (substância medicinal incorporada) (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Anexo I; <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo VIII).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Os números divergem porque o Brasil tem quatro classes (I a IV) e a UE tem I, IIa, IIb e III: em geral, a Classe IV do Brasil corresponde à III da UE e a III do Brasil à IIb. A lógica das regras é a mesma, herdada do <a class=\"hot\" data-refs=\"imdrf\">GHTF</a>/<a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>; por isso o avaliador compara a regra, não o número.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Anexo I, Regras 7, 8, 12 e 14; <a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, Anexo VIII.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "eu-mdr", "imdrf"]}, {"id": "s2", "kicker": "E2  BLOCO 1: CLASSIFICAÇÃO DE RISCO", "title": "Verifique a identificação da ARCA-H", "ex": "E2", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E2  BLOCO 1: CLASSIFICAÇÃO DE RISCO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Verifique a identificação da ARCA-H</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Conferir a classe e a regra declaradas para a ARCA-H nas três jurisdições e as consequências de um erro de classificação.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A Ortovia Implantes Ltda. (empresa fictícia) apresentou a seção de identificação da prótese total de quadril ARCA-H com o texto: “Classe III, Regra 8, regra geral (implantável de longo prazo), em todas as jurisdições”.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. A classe e a regra declaradas estão corretas para o Brasil? Justifique.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Qual é a classe na UE e nos EUA, e com qual base?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Se a declaração fosse aceita, que partes do processo e do dossiê ficariam comprometidas?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não. A ARCA-H é prótese articular total, que está na exceção da Regra 8 e vai para a Classe IV (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Anexo I, Regra 8, alínea h). A regra geral (Classe III) vale para implantáveis de longo prazo não listados nas exceções, como placas e parafusos.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. UE: Classe III, pela Regra 8 do Anexo VIII do <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a> (substituições articulares totais ou parciais). EUA: Classe II com controles especiais, por regulamento de produto (<a class=\"hot\" data-refs=\"cfr-888\">21 CFR 888.3358</a>), via 510(k). A frase “em todas as jurisdições” está errada: a classe é diferente em cada sistema.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. O caminho no Brasil continuaria com análise técnica prévia (Classes III e IV), mas a justificativa de classe ficaria errada e geraria exigência; a avaliação clínica e o arquivo de risco seriam dimensionados para um risco menor; e a lógica de investigação na UE (art. 61(4), implantáveis e Classe III) poderia ser subestimada. O avaliador aponta a regra errada como não conformidade na identificação.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Anexo I, Regra 8; <a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, Anexo VIII, Regra 8 e art. 61(4); <a class=\"hot\" data-refs=\"cfr-888\">21 CFR 888.3358</a>.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "cfr-888", "eu-mdr"]}, {"id": "s3", "kicker": "E3  BLOCO 2: CAMINHOS DE REGULARIZAÇÃO", "title": "O caminho declarado se sustenta?", "ex": "E3", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E3  BLOCO 2: CAMINHOS DE REGULARIZAÇÃO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">O caminho declarado se sustenta?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   20 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se o caminho de regularização proposto para cada mercado é coerente com a classe da ARCA-H.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O plano regulatório da Ortovia (empresa fictícia) para a ARCA-H diz: “Brasil: regularização por notificação, por se tratar de evolução da ARCA-1. UE: autodeclaração de conformidade. EUA: PMA.”</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. O caminho proposto para o Brasil está correto? O que o avaliador espera?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. A autodeclaração é possível na UE para a ARCA-H?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. A via indicada para os EUA é a esperada? Justifique.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não. A ARCA-H é Classe IV e segue a regularização com análise técnica prévia da Anvisa, com certificado de BPF e validade de 10 anos (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, arts. 7º, 11 e 14). Ser evolução da ARCA-1 não muda a classe: ela depende do produto. A avaliação clínica será lida antes da decisão.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Não. A autodeclaração só vale para a Classe I (com organismo notificado nos aspectos Is, Im, Ir). Na Classe III, a avaliação da conformidade envolve organismo notificado, que avalia também a avaliação clínica (<a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, art. 52).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não é a esperada. A prótese de quadril com par cerâmica-polietileno é Classe II nos EUA (<a class=\"hot\" data-refs=\"cfr-888\">21 CFR 888.3358</a>), com via 510(k) por equivalência substancial a um predicado (<a class=\"hot\" data-refs=\"cfr-807\">21 CFR 807</a>, Subparte E). A PMA é a via da Classe III (<a class=\"hot\" data-refs=\"cfr-814\">21 CFR 814</a>). O revisor vai querer a cúpula impressa comparada ao predicado.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, arts. 6º, 7º, 11 e 14; <a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, art. 52; <a class=\"hot\" data-refs=\"cfr-807\">21 CFR 807</a>, 814 e 888.3358.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "cfr-807", "cfr-814", "cfr-888", "eu-mdr"]}, {"id": "s4", "kicker": "E4  BLOCO 3: AVALIAÇÃO E INVESTIGAÇÃO", "title": "Avaliação ou investigação: o que a ARCA-H exige", "ex": "E4", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E4  BLOCO 3: AVALIAÇÃO E INVESTIGAÇÃO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação ou investigação: o que a ARCA-H exige</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Distinguir avaliação clínica de investigação clínica e verificar quando cada jurisdição exige investigação ou DICD.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Num documento interno, a Ortovia (empresa fictícia) afirma: “A ARCA-H não precisa de avaliação clínica própria nem de investigação, porque a ARCA-1 tem anos de mercado no Brasil.” Ela também cogita fazer um estudo no Brasil antes de regularizar a ARCA-H.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. A ARCA-H pode dispensar a avaliação clínica? Justifique.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Se a Ortovia fizer um estudo da ARCA-H no Brasil antes da regularização, o que é exigido e em que prazo a Anvisa se manifesta?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Na UE, em que condições a investigação clínica poderia ser dispensada, e o que o avaliador verifica?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não. A avaliação clínica é exigida para todas as classes e reúne todos os dados clínicos, inclusive a experiência da ARCA-1, mas conclui sobre a ARCA-H (<a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, art. 61(1); Guia Anvisa nº 31/2020). A experiência da ARCA-1 é uma fonte de dados, não uma dispensa.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. A ARCA-H é Classe IV não regularizada: exige o DICD submetido à Anvisa (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, art. 4º) e a aprovação do CEP. A Anvisa se manifesta em até 90 dias corridos (art. 8º); sem manifestação nesse prazo, o estudo pode começar após a aprovação ética.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Implantáveis e Classe III exigem investigação (art. 61(4)), salvo exceções, como o dispositivo modificado a partir de outro já comercializado pelo mesmo fabricante, com equivalência demonstrada pelo fabricante e endossada pelo organismo notificado, e avaliação clínica do dispositivo original suficiente (art. 61(4) a (6); <a class=\"hot\" data-refs=\"mdcg\">MDCG 2023-7</a>). O avaliador verifica essas condições; a cúpula impressa é a diferença que pode impedir a exceção, tema do M2.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, art. 61; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2023-7</a>; <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, arts. 4º e 8º; Guia Anvisa nº 31/2020, v2.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "eu-mdr", "mdcg"]}, {"id": "s5", "kicker": "E5  BLOCO 4: DOSSIÊ TÉCNICO", "title": "Inconsistências no dossiê da ARCA-H", "ex": "E5", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E5  BLOCO 4: DOSSIÊ TÉCNICO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Inconsistências no dossiê da ARCA-H</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Identificar inconsistências e lacunas entre seções do dossiê técnico e o requisito que fica sem prova.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Trechos do dossiê da ARCA-H (Ortovia, empresa fictícia): (a) especificação: cúpula com estrutura porosa de titânio por manufatura aditiva; (b) relatório de ensaio mecânico da cúpula: amostras com revestimento poroso por spray de plasma; (c) avaliação biológica: laudos da ARCA-1; (d) fabricação: lista de processos sem validação da manufatura aditiva; (e) arquivo de risco: não cita falha de fixação ou osteointegração da cúpula.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Quais inconsistências entre seções você identifica?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Que requisito ou exigência fica sem prova em cada caso?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O que o avaliador pede à empresa?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. O ensaio (b) não representa o produto especificado (a): foi feito com cúpula de spray de plasma. A avaliação biológica (c) é de outro processo e outra superfície. A fabricação (d) não trata a manufatura aditiva como processo especial. O arquivo de risco (e) não cita o perigo ligado à parte nova, que a avaliação clínica terá de discutir.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Desempenho e segurança mecânica da cúpula (ensaio não representativo); propriedades químicas, físicas e biológicas (GSPR 10 / <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 848/2024</a>), sem avaliação conforme a <a class=\"hot\" data-refs=\"iso-10993\">ISO 10993-1</a>; validação de processo especial (<a class=\"hot\" data-refs=\"iso-13485\">ISO 13485:2016</a>, 7.5.6); gerenciamento de risco completo (<a class=\"hot\" data-refs=\"iso-14971\">ISO 14971:2019</a>).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Ensaios com amostras representativas do produto final e critérios definidos antes do ensaio; avaliação biológica revista para a nova superfície e o novo processo; evidência de validação da manufatura aditiva; atualização do arquivo de risco, coerente com a avaliação clínica. Inconsistência entre seções pesa tanto quanto seção ausente.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485:2016</a>, 7.5.6; <a class=\"hot\" data-refs=\"iso-10993\">ISO 10993-1</a>; <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971:2019</a>; <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 848/2024</a> (requisitos essenciais).</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "iso-10993", "iso-13485", "iso-14971"]}, {"id": "s6", "kicker": "E6  BLOCO 5: USO PRETENDIDO", "title": "A finalidade da ARCA-H cabe na evidência?", "ex": "E6", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E6  BLOCO 5: USO PRETENDIDO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">A finalidade da ARCA-H cabe na evidência?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se a finalidade de uso declarada na instrução de uso está limitada à evidência e identificar o mau uso previsível.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O dossiê da ARCA-H define a finalidade como artroplastia total primária do quadril, não cimentada, em adultos com esqueleto maduro, para osteoartrite e necrose avascular, excluindo revisão e displasia grave. A instrução de uso preliminar diz: “Indicada para artroplastia total do quadril, primária ou de revisão, em pacientes com doença degenerativa do quadril, incluindo displasia.”</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Quais termos da instrução de uso não têm evidência no dossiê?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Classifique cada divergência pelas três armadilhas (genérica, além da evidência, limitação omitida).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Que mau uso razoavelmente previsível o avaliador espera ver no arquivo de risco, e em que ordem os controles são aplicados?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. “De revisão”, “incluindo displasia” e “doença degenerativa do quadril” (mais amplo que osteoartrite e necrose avascular). Também falta a população (adultos com esqueleto maduro) e a técnica não cimentada.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. “Doença degenerativa do quadril”: genérica demais. “Revisão” e “displasia”: além da evidência. Ausência da população e das exclusões: limitação omitida. A saída é limitar a instrução de uso à finalidade do dossiê ou gerar novos dados.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Uso em cirurgia de revisão, uso em displasia grave e combinação com componentes de outro fabricante. Os controles seguem a ordem da <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971:2019</a>, 7.1: segurança inerente pelo projeto, medidas de proteção e, por último, informação de segurança (rotulagem e instruções).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>, princípios de finalidade de uso; <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971:2019</a>, 7.1; IEC 62366-1; Guia Anvisa nº 31/2020, v2.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["imdrf", "iso-14971"]}, {"id": "s7", "kicker": "E7  BLOCO 6: HARMONIZAÇÃO", "title": "Uma evidência, três mercados", "ex": "E7", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E7  BLOCO 6: HARMONIZAÇÃO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Uma evidência, três mercados</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Mapear requisitos essenciais para a prova esperada e delimitar quando a evidência pode ser reaproveitada entre jurisdições.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A Ortovia (empresa fictícia) propõe usar, nos pedidos do Brasil, da UE e dos EUA, a experiência de mercado da ARCA-1 no Brasil como principal evidência clínica da ARCA-H. A ARCA-1 tem cúpula com revestimento por spray de plasma; a ARCA-H tem cúpula impressa e haste com colo de comprimento diferente.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Para qual prova apontam os GSPR 1 e 8, 10 e 23 no caso da ARCA-H?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Em que condições a mesma evidência pode sustentar pedidos em jurisdições diferentes?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Onde a experiência da ARCA-1 pode servir e onde não serve? O que segue para o M2?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. GSPR 1 e 8 (desempenho e benefício-risco): dados clínicos da avaliação clínica. GSPR 10 (propriedades químicas, físicas e biológicas): avaliação biológica da cúpula impressa. GSPR 23 (rótulo e instruções): instruções de uso e cartão do implante (art. 18), coerentes com a finalidade (<a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, Anexo I; no Brasil, <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 848/2024</a>).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Quando dispositivo, população e indicação são os mesmos do pedido. Se algum muda, a evidência precisa de complemento. Cada jurisdição recebe a evidência mapeada aos seus requisitos (GSPR na UE, <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 848/2024</a> no Brasil, equivalência substancial a um predicado no 510(k)).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Pode servir, com justificativa, à haste (mudança mínima) e ao par de atrito cerâmica-polietileno, que é o mesmo. Não serve, sozinha, à cúpula impressa, cuja superfície e processo são diferentes. Segue para o M2 a análise de equivalência técnica, biológica e clínica com a ARCA-1.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"eu-mdr\">Regulamento (UE) 2017/745</a>, Anexo I, art. 18 e art. 61; <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 848/2024</a> (requisitos essenciais); <a class=\"hot\" data-refs=\"cfr-807\">21 CFR 807</a>, Subparte E.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "cfr-807", "eu-mdr"]}, {"id": "s8", "kicker": "Q  FECHAMENTO", "title": "Avaliação objetiva: 10 questões", "ex": "Q", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">Q  FECHAMENTO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação objetiva: 10 questões</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Marque uma alternativa por questão. Cada questão indica onde conferir a resposta no documento oficial.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Uma prótese total de joelho e uma placa de osteossíntese são implantáveis de longo prazo. Como ficam classificadas no Brasil?</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Ambas na Classe III, pela regra geral da Regra 8</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Ambas na Classe IV, por serem implantáveis</span></p><p class=\"opt opt-ok\" data-q=\"gab:q1\" data-o=\"c\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Prótese na Classe IV e placa na Classe III, pela exceção das próteses articulares</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Prótese na Classe III e placa na Classe II</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Quando duas ou mais regras de classificação se aplicam ao mesmo dispositivo, qual classe vale?</span></p><p class=\"opt opt-ok\" data-q=\"gab:q2\" data-o=\"a\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) A mais alta entre as regras aplicáveis</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) A regra mais específica, mesmo que dê classe menor</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) A classe declarada pelo fabricante</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) A média das classes</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. No Brasil, qual é o regime de regularização para as Classes I e II?</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Regularização com análise técnica prévia</span></p><p class=\"opt opt-ok\" data-q=\"gab:q3\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Regularização por notificação, sem análise técnica prévia</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Dispensa de regularização</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Autodeclaração, como na UE</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Na regularização com análise técnica prévia (Classes III e IV), qual o prazo para a empresa responder a uma exigência?</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) 30 dias, prorrogáveis</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) 60 dias</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) 90 dias corridos</span></p><p class=\"opt opt-ok\" data-q=\"gab:q4\" data-o=\"d\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) 120 dias, improrrogáveis</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. Qual a classe e a via esperadas para a ARCA-H nos EUA?</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Classe III, via PMA</span></p><p class=\"opt opt-ok\" data-q=\"gab:q5\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Classe II, via 510(k), pelo <a class=\"hot\" data-refs=\"cfr-888\">21 CFR 888.3358</a></span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Classe I, isenta de 510(k)</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Classe IV, via De Novo</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. Qual afirmação descreve corretamente a relação entre avaliação clínica e investigação clínica?</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) São sinônimos</span></p><p class=\"opt opt-ok\" data-q=\"gab:q6\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) A investigação clínica é uma das fontes de dados da avaliação clínica</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) A avaliação clínica só existe quando há investigação</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) A investigação substitui a avaliação clínica na Classe IV</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. Pela <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, em quanto tempo a Anvisa se manifesta sobre o DICD?</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) 30 dias úteis</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) 60 dias corridos</span></p><p class=\"opt opt-ok\" data-q=\"gab:q7\" data-o=\"c\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) 90 dias corridos</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) 180 dias</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. Pela <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971:2019</a>, 7.1, qual é a ordem de prioridade dos controles de risco?</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Informação de segurança, medidas de proteção, projeto</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Medidas de proteção, projeto, informação de segurança</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Projeto, informação de segurança, medidas de proteção</span></p><p class=\"opt opt-ok\" data-q=\"gab:q8\" data-o=\"d\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Segurança inerente pelo projeto, medidas de proteção, informação de segurança</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">9. O estudo de um stent incluiu lesões de até 25 mm, mas a finalidade declara lesões de até 40 mm. Que armadilha é essa?</span></p><p class=\"opt opt-ok\" data-q=\"gab:q9\" data-o=\"a\" data-ok=\"1\" style /* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||p.get("cuser_name")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;

  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";

  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
})();
