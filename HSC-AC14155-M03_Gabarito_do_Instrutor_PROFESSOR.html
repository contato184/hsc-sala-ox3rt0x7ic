:root{
  --navy:#001372; --navy-2:#000B4A; --night:#060B2E; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#C3C8D2; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#001372; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido — HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

body{background:#F4F6FC;color:var(--ink)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy-2) 0%,var(--navy) 100%);color:#fff;padding:24px 0 34px}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:min(46%,760px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.hero .wrapc{position:relative}
.wrapc{max-width:1120px;margin:0 auto;padding:0 20px}
.hero .bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero .bar img{height:22px}
.hero .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.hero .bar span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero .bar .badge{margin-left:auto;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.hero .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;font-weight:600;margin:10px 0 6px;line-height:1.15}
.hero .sub{font-size:18px;opacity:.9}
.hero .seals{display:flex;gap:14px;margin-top:18px;align-items:center}
.hero .seals img{height:58px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding:24px 0 70px}
.toc{position:sticky;top:14px;align-self:start;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:12px;max-height:calc(100vh - 28px);overflow:auto}
.toc h4{margin:4px 8px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.toc a:hover{background:var(--ice)}
.toc a.on{background:var(--navy);color:#fff}
.toc a b{font-size:11px;min-width:26px;color:var(--accent)}
.toc a.on b{color:#9DB1FF}
.toc a .dn{margin-left:auto;color:var(--ok);font-size:12px}
.page{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:30px 36px;min-width:0}
.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.prof .opt{cursor:default}
.navx{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 30px;line-height:1.6}
footer img{height:18px;display:block;margin:0 auto 8px}
@media (max-width:860px){ .layout{grid-template-columns:1fr} .toc{position:static;max-height:none} .page{padding:20px 16px} .hero h1{font-size:25px} }
.footbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:30;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body{padding-bottom:44px}
.wm{bottom:7px!important}

99;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Distinguir as fontes de dados clínicos e reconhecer quais se aplicam ao dispositivo avaliado.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A Ortovia Implantes Ltda. (empresa fictícia) apresentou, para a cúpula acetabular impressa do ARCA-H: (a) estudos publicados de cúpulas de titânio poroso impressas por outros fabricantes; (b) dados pós-mercado da ARCA-1, cuja cúpula tem revestimento por spray de plasma; (c) relatórios de registros de artroplastia com cúpulas impressas de vários fabricantes. Não há investigação clínica do ARCA-H. O relatório afirma: nenhum evento adverso grave relacionado a cúpulas impressas foi relatado na literatura encontrada; portanto, a cúpula é segura.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Classifique cada fonte (a, b, c): é dado do próprio ARCA-H, do antecessor ou de outros fabricantes?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Os dados pós-mercado da ARCA-1 podem sustentar a segurança da cúpula do ARCA-H? Justifique.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Você aceita a conclusão de segurança do relatório? O que o avaliador verifica antes?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. (a) outros fabricantes; (b) antecessor, com outra cúpula; (c) outros fabricantes, agrupados. Nenhuma fonte é dado clínico da cúpula do ARCA-H (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 8).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Não. A cúpula da ARCA-1 difere em superfície, porosidade e processo; a equivalência foi recusada no Módulo 2. Dados de outro produto só valem com equivalência técnica, biológica e clínica demonstrada (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte A; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A1).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não. Ausência de relato não é prova de segurança. O avaliador verifica se a busca foi desenhada para encontrar eventos adversos (termos, bases de notificações, registros) e se considerou todos os dados disponíveis, inclusive desfavoráveis (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 8).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 8 e Anexo A1; <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61 e Anexo XIV, Parte A.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["eu-mdr", "meddev"]}, {"id": "s2", "kicker": "E2  BLOCO 2: FLUXO PRISMA", "title": "O diagrama PRISMA da Ortovia fecha?", "ex": "E2", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E2  BLOCO 2: FLUXO PRISMA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">O diagrama PRISMA da Ortovia fecha?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar a coerência numérica e documental de um diagrama PRISMA.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Valores ilustrativos. O protocolo de busca da Ortovia prevê PubMed, Embase, Cochrane Library e LILACS. O diagrama apresentado mostra: PubMed n=180; Embase n=140; duplicatas removidas n=60; registros triados n=250; excluídos na triagem n=210, todos com o motivo não relevante; textos completos avaliados n=40; incluídos n=12. A tabela de evidência do relatório tem 10 linhas.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. As contas do diagrama fecham? Mostre onde.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. O que falta no diagrama em relação ao protocolo?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O motivo não relevante é aceitável? O que o avaliador espera em cada fase?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Que divergência existe com a tabela de evidência e o que você pede?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não. 180 + 140 = 320; 320 − 60 = 260, e não 250 triados. Além disso, 250 − 210 = 40 confere, mas o ponto de partida está errado. O avaliador pede a correção antes de qualquer conclusão (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5; PRISMA).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Cochrane Library e LILACS não aparecem, sem justificativa. Bases previstas e não executadas precisam de explicação (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não. Na triagem, os motivos devem ser agrupados por critério (população, intervenção, desenho). Na elegibilidade, as 28 exclusões (40 − 12) precisam de razão específica e referência, para que a seleção possa ser reproduzida.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. O diagrama diz 12 incluídos e a tabela tem 10 linhas. O avaliador pede a explicação: dois estudos faltam na tabela ou o diagrama está errado. Incluídos devem corresponder às linhas da tabela de evidência.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5; PRISMA Statement (2009 e 2020).</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["meddev"]}, {"id": "s3", "kicker": "E3  BLOCO 2: CRITÉRIOS DE ELEGIBILIDADE", "title": "Os critérios da Ortovia se sustentam?", "ex": "E3", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E3  BLOCO 2: CRITÉRIOS DE ELEGIBILIDADE</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Os critérios da Ortovia se sustentam?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   10 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se os critérios de elegibilidade foram definidos a priori e se as exclusões se sustentam.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Datas ilustrativas. O protocolo de busca da Ortovia está datado de 10/03; a busca foi executada em 02/03. Os critérios limitam o período aos últimos 3 anos e o idioma ao inglês, sem justificativa. Entre os incluídos há dois estudos de artroplastia de revisão. Um estudo de cúpula impressa que relatou afrouxamento precoce foi excluído por seguimento curto, critério que não consta do protocolo.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Os critérios foram definidos a priori? Qual a consequência?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. As restrições de período e de idioma se sustentam para essa tecnologia?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Os estudos de revisão deveriam ter sido incluídos?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. A exclusão do estudo com afrouxamento precoce se sustenta?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não: o protocolo é posterior à execução. Critérios fixados depois de ver os resultados deixam a seleção sob suspeita de viés (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Não sem justificativa. A manufatura aditiva de cúpulas é recente, e um período curto pode eliminar os estudos de seguimento mais longo; restrição de idioma pode excluir populações relevantes. Cada restrição precisa ser justificada.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não. O uso pretendido do ARCA-H é artroplastia total primária; revisão e displasia grave estão excluídas (Módulo 1). Esses estudos deveriam sair pelo motivo população.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Não. Toda exclusão precisa corresponder a um critério escrito no protocolo. Excluir um estudo desfavorável por critério ausente compromete a avaliação e contraria o dever de considerar os dados disponíveis (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 8 e Anexo A5).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 8 e Anexo A5; <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte A.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["eu-mdr", "meddev"]}, {"id": "s4", "kicker": "E4  BLOCO 3: PERGUNTA PICO", "title": "O PICO da Ortovia é preciso?", "ex": "E4", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E4  BLOCO 3: PERGUNTA PICO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">O PICO da Ortovia é preciso?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Individual   10 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se a pergunta PICO permite julgar a aplicabilidade dos estudos ao dispositivo avaliado.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O protocolo de busca da Ortovia traz a pergunta: P, pacientes submetidos a artroplastia de quadril; I, cúpula acetabular porosa; C, não definido; O, resultados clínicos.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. O que falta no P em relação ao uso pretendido do ARCA-H?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Que efeito o I escrito como cúpula acetabular porosa tem sobre a busca?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O que o avaliador espera encontrar em C e em O?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Falta delimitar adultos com esqueleto maduro, artroplastia total primária e as indicações (osteoartrite e necrose avascular). Sem isso entram revisão e displasia grave, que o uso pretendido exclui (Módulo 1).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. O I vago traz estudos da ARCA-1 e de outras cúpulas com revestimento aplicado, que não representam a manufatura aditiva. O I precisa nomear o que é novo: titânio poroso produzido por manufatura aditiva (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. C: cúpulas não cimentadas convencionais com revestimento poroso aplicado. O: desfechos de segurança e desempenho definidos, como sobrevida do implante, revisão por qualquer causa, escore funcional e eventos adversos, com o tempo de seguimento (Richardson et al., 1995; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: Richardson et al. (1995); <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5; uso pretendido do ARCA-H (Módulo 1).</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["meddev"]}, {"id": "s5", "kicker": "E5  BLOCO 3: ESTRATÉGIA DE BUSCA", "title": "A busca da Ortovia pode ser repetida?", "ex": "E5", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E5  BLOCO 3: ESTRATÉGIA DE BUSCA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">A busca da Ortovia pode ser repetida?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se o registro da busca é reprodutível e se a busca é exaustiva para um implante de quadril.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O registro da busca da Ortovia informa: base PubMed; expressão hip cup 3D; sem data de execução; sem filtros declarados. A triagem foi feita por um revisor, sem registro das decisões. Não há menção a relatórios de registros de artroplastia nem a bases de notificações de eventos adversos.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. A busca pode ser repetida por outra pessoa? O que falta no registro?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. A busca é exaustiva? Que fontes e termos faltam?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O que o avaliador pede sobre a triagem?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não. Faltam a data de execução, a expressão completa por base, os filtros e a justificativa para usar uma única base (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Não. Faltam termos controlados (MeSH) e sinônimos (3D-printed, additive manufacturing, acetabular component), a combinação com OR e AND dos conceitos do PICO, outras bases (Embase, Cochrane, LILACS), registros de estudos e, para implante de quadril, relatórios de registros de artroplastia e bases de notificações.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. O registro das decisões de inclusão e exclusão, com motivos, e, de preferência, dois revisores independentes com desacordos resolvidos e registrados. Ferramentas como o Rayyan organizam, mas não substituem o registro.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5; PRISMA Statement; PubMed (MeSH).</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["meddev"]}, {"id": "s6", "kicker": "E6  BLOCO 4: TABELA DE EVIDÊNCIA", "title": "Quanto pesa cada estudo da tabela?", "ex": "E6", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E6  BLOCO 4: TABELA DE EVIDÊNCIA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Quanto pesa cada estudo da tabela?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   20 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Avaliar risco de viés e aplicabilidade dos estudos de uma tabela de evidência.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Estudos e valores ilustrativos. A tabela da Ortovia traz: Estudo A, coorte prospectiva de cúpula impressa do fabricante X, seguimento de 5 anos, escore funcional medido pelo cirurgião que operou, sem cegamento, financiada pelo fabricante X; Estudo B, relatório de registro de artroplastia que agrupa cúpulas impressas de vários fabricantes; Estudo C, série de casos com a ARCA-1. O relatório conclui que os três estudos demonstram a segurança da cúpula do ARCA-H.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Que ferramenta de risco de viés o avaliador espera para os estudos A e B? Por quê?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Que domínio de risco de viés o escore funcional sem cegamento afeta?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Qual coluna da tabela decide o peso de cada estudo para o ARCA-H, e o que ela mostra?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. O financiamento do fabricante X invalida o Estudo A?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. ROBINS-I, porque são estudos não randomizados (coorte e registro). O RoB 2 se aplica a ensaios randomizados (Cochrane).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. A mensuração do desfecho (no RoB 2, domínio D4; no ROBINS-I, o domínio equivalente de mensuração dos desfechos): desfecho subjetivo medido por avaliador não cego.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. A de aplicabilidade (comentários, coluna 15). A e B são de outros fabricantes, com outra porosidade, geometria e processo; C é da ARCA-1, com outra cúpula. Nenhum demonstra a segurança da cúpula do ARCA-H; servem como estado da arte (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 9 e Anexo A6).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Não invalida, mas precisa estar registrado na coluna de financiamento e considerado na avaliação do risco de viés.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 9 e Anexo A6; Cochrane, RoB 2 e ROBINS-I.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["meddev"]}, {"id": "s7", "kicker": "E7  BLOCO 5: CASO GLUCOSENSE", "title": "A busca do GlucoSense se sustenta?", "ex": "E7", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E7  BLOCO 5: CASO GLUCOSENSE</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">A busca do GlucoSense se sustenta?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   25 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar a coerência de uma busca completa, do PICO à triagem, e a aplicabilidade do que ela encontra.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Caso didático GlucoSense (empresa fictícia), Parte 2, slides 13 a 19: população-alvo de 18 a 65 anos com DM1 e HbA1c de 7% a 10%; PICO com P = adultos com DM1 e HbA1c &gt; 7%; duas versões da expressão do PubMed (uma com datas de 2016/01/01 a 2026/12/31 e estudos observacionais; outra com últimos 10 anos e <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155</a> OR GCP como texto livre); busca executada em 15/12/2024 em seis fontes, com 929 registros, 241 duplicatas e 688 para triagem. O equivalente buscado é qualquer CGM subcutâneo com alarmes aprovado por FDA, CE ou Anvisa, inclusive monitoramento flash.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Os números da identificação fecham?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Que inconsistências você aponta nas duas versões da expressão e na data de execução?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O PICO reproduz a população-alvo do caso?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Os sistemas encontrados podem ser tratados como equivalentes ao GlucoSense Pro?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Sim: 284 + 312 + 45 + 198 + 23 + 67 = 929; 929 − 241 = 688. Ressalva: as fontes misturam artigos, revisões sistemáticas e registros de estudos, o que precisa de tratamento justificado no protocolo (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A5).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Há duas versões e o registro não diz qual foi executada. A versão 1 vai até 31/12/2026, depois da execução; a versão 2 usa <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155</a> e GCP como texto livre, o que não filtra conformidade e restringe a busca. O registro precisa da expressão exata executada, por base, com data.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não. O P diz HbA1c &gt; 7% sem faixa etária; a população-alvo diz 18 a 65 anos e HbA1c de 7% a 10%. A divergência precisa ser resolvida no protocolo, porque os critérios derivam do PICO.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Não automaticamente. Estar aprovado não demonstra equivalência técnica, biológica e clínica; monitoramento flash não transmite continuamente. A literatura informa o estado da arte, mas a equivalência precisa ser demonstrada ponto a ponto (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte A; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexo A1).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: Caso didático HSC; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexos A1 e A5; PRISMA Statement.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["eu-mdr", "iso-14155", "meddev"]}, {"id": "s8", "kicker": "E8  BLOCO 5: DECISÃO SOBRE A CÚPULA", "title": "A decisão sobre a cúpula", "ex": "E8", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E8  BLOCO 5: DECISÃO SOBRE A CÚPULA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">A decisão sobre a cúpula</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Individual   10 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Decidir se a literatura fecha a lacuna da cúpula do ARCA-H e justificar com a base regulatória.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O relatório de avaliação clínica da Ortovia conclui: a literatura sobre cúpulas impressas demonstra a segurança e o desempenho da cúpula do ARCA-H, dispensando dados clínicos próprios. O ARCA-H é implantável, Classe III na UE (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo VIII, Regra 8) e Classe IV no Brasil (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Regra 8).</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Você aceita a conclusão? Justifique.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Para que serve, então, a literatura encontrada?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O que o <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a> exige para um implantável de Classe III?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Que decisão segue para o Módulo 4 para a haste e para a cúpula?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Não. Nenhum estudo é do ARCA-H e não há equivalência demonstrada para a cúpula (Módulo 2). Literatura de produtos semelhantes não demonstra a conformidade do produto avaliado (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 10).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Como estado da arte: tecnologia, desfechos esperados, riscos conhecidos e referência para os objetivos do PMCF e da investigação.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Investigação clínica, salvo as exceções previstas no próprio artigo, que não se aplicam aqui (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61(4) a (6)).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Haste: apoio na equivalência e nos dados da ARCA-1. Cúpula: gerar dados clínicos próprios, por investigação clínica e PMCF (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte B).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61(4) a (6) e Anexo XIV, Partes A e B; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, seção 10.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "eu-mdr", "meddev"]}, {"id": "s9", "kicker": "Q  FECHAMENTO", "title": "Avaliação objetiva: 10 questões", "ex": "Q", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">Q  FECHAMENTO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação objetiva: 10 questões</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Marque uma alternativa por questão. Cada questão indica onde conferir a resposta no documento oficial.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Na avaliação clínica, o que significa considerar os dados disponíveis?</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Usar apenas os dados que o fabricante já tem em arquivo</span></p><p class=\"opt opt-ok\" data-q=\"gab:q1\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Procurar ativamente os dados existentes, inclusive os desfavoráveis</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Usar apenas estudos publicados em periódicos indexados</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Usar apenas dados gerados conforme a <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155</a></span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. No diagrama PRISMA, qual conferência o avaliador faz na fase de identificação?</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Incluídos devem ser mais de 10% dos identificados</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Cada base deve trazer o mesmo número de registros</span></p><p class=\"opt opt-ok\" data-q=\"gab:q2\" data-o=\"c\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Soma por base, menos duplicatas, igual ao número triado</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Duplicatas devem ser excluídas só na elegibilidade</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Por que os critérios de elegibilidade devem ser definidos a priori?</span></p><p class=\"opt opt-ok\" data-q=\"gab:q3\" data-o=\"a\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Para minimizar o viés de seleção</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Para reduzir o número de bases consultadas</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Para dispensar o segundo revisor</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Para permitir ajustar os critérios aos resultados</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. A mesma coorte aparece em duas publicações. O que o critério de exclusão da aula indica?</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Incluir as duas, porque somam pacientes</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Excluir as duas por duplicidade</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Escolher a de resultado mais favorável</span></p><p class=\"opt opt-ok\" data-q=\"gab:q4\" data-o=\"d\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Usar a publicação mais recente e completa</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. No formato PICOS, o que a letra S acrescenta?</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) O tamanho da amostra</span></p><p class=\"opt opt-ok\" data-q=\"gab:q5\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) O desenho de estudo aceito</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) O patrocinador do estudo</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) A significância estatística</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. No PICO da cúpula do ARCA-H, qual o efeito de escrever o I apenas como cúpula acetabular porosa?</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Nenhum, porque a busca fica mais ampla e completa</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) A busca passa a excluir cúpulas impressas</span></p><p class=\"opt opt-ok\" data-q=\"gab:q6\" data-o=\"c\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) A busca traz a ARCA-1 e produtos não representativos da manufatura aditiva</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) A busca se limita automaticamente a ensaios randomizados</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. O que torna uma busca reprodutível?</span></p><p class=\"opt opt-ok\" data-q=\"gab:q7\" data-o=\"a\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Data e expressão exata de cada execução, base por base</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Uso de pelo menos uma base europeia</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Inclusão de metanálise</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Uso de uma ferramenta de triagem como o Rayyan</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. Num ensaio randomizado, um escore funcional medido por avaliador não cego afeta principalmente qual domínio do RoB 2?</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) D1, processo de randomização</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) D3, dados de desfecho ausentes</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) D5, seleção do resultado relatado</span></p><p class=\"opt opt-ok\" data-q=\"gab:q8\" data-o=\"d\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) D4, mensuração do desfecho</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">9. Para uma coorte não randomizada de cúpulas impressas, que ferramenta de risco de viés o avaliador espera?</span></p><p class=\"opt\" data-q=\"gab:q9\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\"  61(4)</span></p></td></tr></table></div><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>; <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61; PRISMA Statement; Cochrane RoB 2 e ROBINS-I; Richardson et al. (1995).</span></p>", "refs": ["eu-mdr", "iso-14155", "meddev"]}];

/* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||p.get("cuser_name")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";
  if(!HSC.boot()) return;
  document.body.classList.toggle("prof",PROF);
  $("#heroPh").style.backgroundImage=`url(${ASSETS.heroFoto})`;
  $("#logo").src=ASSETS.logoWhite; $("#flogo").src=ASSETS.logoNavy; 
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno"; $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
