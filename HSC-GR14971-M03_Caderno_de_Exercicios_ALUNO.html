:root{
  --navy:#001372; --navy-2:#000B4A; --night:#060B2E; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#C3C8D2; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#001372; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido — HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

body{background:#F4F6FC;color:var(--ink)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy-2) 0%,var(--navy) 100%);color:#fff;padding:24px 0 34px}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:min(46%,760px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.hero .wrapc{position:relative}
.wrapc{max-width:1120px;margin:0 auto;padding:0 20px}
.hero .bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero .bar img{height:22px}
.hero .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.hero .bar span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero .bar .badge{margin-left:auto;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.hero .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;font-weight:600;margin:10px 0 6px;line-height:1.15}
.hero .sub{font-size:18px;opacity:.9}
.hero .seals{display:flex;gap:14px;margin-top:18px;align-items:center}
.hero .seals img{height:58px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding:24px 0 70px}
.toc{position:sticky;top:14px;align-self:start;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:12px;max-height:calc(100vh - 28px);overflow:auto}
.toc h4{margin:4px 8px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.toc a:hover{background:var(--ice)}
.toc a.on{background:var(--navy);color:#fff}
.toc a b{font-size:11px;min-width:26px;color:var(--accent)}
.toc a.on b{color:#9DB1FF}
.toc a .dn{margin-left:auto;color:var(--ok);font-size:12px}
.page{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:30px 36px;min-width:0}
.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}

calas e matriz de um plano para estimar riscos e indicar quais exigem controle.</span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Plano rev. B da bomba (fictício): severidade em 5 níveis (desprezível, menor, séria, crítica, catastrófica) e probabilidade em 5 níveis (improvável, remota, ocasional, provável, frequente). Matriz do slide 5. Regras: A = inaceitável, reduzir; M = reduzir tanto quanto possível e justificar; B = aceitável. Se a probabilidade não puder ser estimada, severidade crítica ou catastrófica exige controle.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(1) Sobreinfusão de heparina por erro de programação. Severidade: crítica. Probabilidade: ocasional (reclamações de bombas semelhantes).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(2) Desligamento por bateria esgotada no transporte, paciente em hidratação de manutenção. Severidade: menor. Probabilidade: provável.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(3) Choque elétrico no operador por corrente de fuga. Severidade: séria. Probabilidade: improvável (projeto classe I e ensaios da <a class=\"hot\" data-refs=\"iec\">IEC 60601-1</a>).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(4) Falha do software que calcula o fluxo durante a infusão de um vasoativo. Severidade: catastrófica. Probabilidade: sem dados.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Qual é o nível de risco das situações (1), (2) e (3) pela matriz?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f1\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Quais situações exigem controle pelo plano rev. B?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f2\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Como a situação (4) deve ser tratada?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f3\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Uma probabilidade baseada apenas em \"opinião da equipe\", sem registro, seria aceita pelo avaliador?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f4\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-top:8px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\">Fonte: Exemplo didático; <a class=\"hot\" data-refs=\"abnt\">ABNT NBR ISO 14971:2020</a>, 4.4 d), 5.5 e 6.</span></p><p class=\"emp\">&nbsp;</p>"}, {"id": "s2", "kicker": "E2  BLOCO 2: TÉCNICAS", "title": "Revisão crítica de um trecho de FMEA", "ex": "E2", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;letter-spacing:2.72px;color:#4A6CF7\">E2  BLOCO 2: TÉCNICAS</span></p><p style=\"margin-bottom:8.2px\"><span style=\"font-weight:700;font-size:19.0px;color:#001372\">Revisão crítica de um trecho de FMEA</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:26.00%\"><col style=\"width:74.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:600;font-size:13.6px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Grupo   15 min</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:600;font-size:13.6px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Reconhecer onde um FMEA deixa de atender à <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971</a>.</span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Trecho do FMEA de projeto da bomba (documento fictício):</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Linha 1. Sensor de oclusão; modo de falha: deriva de calibração; efeito: alarme tardio. S = 8, O = 3, D = 2, NPR = 48. Ação: nenhuma (\"NPR menor que 100, aceitável\").</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Linha 2. Teclado; modo de falha: \"usuário digita a vírgula no lugar errado\". S = 9, O = 5, D = 8, NPR = 360. Ação: advertência no manual.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Linha 3. Detector de ar; modo de falha: não detecta bolha; efeito: embolia gasosa. S = 10, O = 2, D = 9, NPR = 180. Ação: inspeção final de 100% na fábrica; D passa a 2, NPR = 40, \"risco reduzido\".</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Linha 4. Bateria; modo de falha: descarga antes do previsto. Ação: \"advertência no manual\".</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. O que está errado na decisão da linha 1?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f5\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. A linha 2 descreve um modo de falha do teclado? Onde esse cenário deveria ser tratado?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f6\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Na linha 3, o que a inspeção final reduz e o que ela não reduz?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f7\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Nas linhas 2 e 4, o que a ordem de prioridade de 7.1 exige antes de aceitar só uma advertência?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f8\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. Este FMEA pode ser, sozinho, a análise de risco da bomba? Justifique.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f9\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-top:8px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"abnt\">ABNT NBR ISO 14971:2020</a>, 4.4, 5.5, 6, 7.1 e 7.2; <a class=\"hot\" data-refs=\"tr24971\">ISO/TR 24971:2020</a>, Anexo B; <a class=\"hot\" data-refs=\"iec\">IEC 62366-1</a>.</span></p><p class=\"emp\">&nbsp;</p>"}, {"id": "s3", "kicker": "E3  BLOCO 3: CONTROLE", "title": "Classificar e verificar controles", "ex": "E3", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;letter-spacing:2.72px;color:#4A6CF7\">E3  BLOCO 3: CONTROLE</span></p><p style=\"margin-bottom:8.2px\"><span style=\"font-weight:700;font-size:19.0px;color:#001372\">Classificar e verificar controles</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:26.00%\"><col style=\"width:74.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:600;font-size:13.6px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Grupo   15 min</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:600;font-size:13.6px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px;line-height:1.4\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Aplicar a ordem de prioridade de 7.1 e distinguir verificação de implementação e de eficácia.</span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Medidas propostas para os riscos de sobreinfusão e de fluxo incorreto da bomba:</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Mecanismo que impede fluxo livre quando a porta é aberta.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Biblioteca de medicamentos com limites de dose.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Alarme de oclusão.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Advertência no manual para conferir a vírgula.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(e) Treinamento obrigatório da enfermagem.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(f) Ensaio funcional de 100% dos detectores de ar na linha de produção.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Classifique cada medida na ordem de prioridade de 7.1.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f10\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Como verificar a implementação e a eficácia das medidas (b) e (c)?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f11\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Alguma dessas medidas pode criar novo risco? Qual cláusula trata disso?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f12\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Se, depois das medidas, a sobreinfusão continuar no nível M, o que a norma pede?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col></colgroup><tr><td colspan=\"1\"><textarea class=\"fld\" data-k=\"cad:f13\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p style=\"margin-top:8px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"abnt\">ABNT NBR ISO 14971:2020</a>, 7.1 a 7.5.</span></p><p class=\"emp\">&nbsp;</p>"}, {"id": "s4", "kicker": "Q  FECHAMENTO", "title": "Avaliação objetiva: 10 questões", "ex": "Q", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;letter-spacing:2.72px;color:#4A6CF7\">Q  FECHAMENTO</span></p><p style=\"margin-bottom:8.2px\"><span style=\"font-weight:700;font-size:19.0px;color:#001372\">Avaliação objetiva: 10 questões</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Marque uma alternativa por questão. Cada questão indica onde conferir a resposta no documento oficial.</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Se a probabilidade de dano não pode ser estimada, a norma pede:</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Descartar o risco</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Listar as consequências possíveis para avaliação e controle</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Usar probabilidade zero</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Consultar a Anvisa</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. A avaliação de risco (cláusula 6) compara:</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) O NPR com 100</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) O risco estimado com os critérios do plano</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) O produto com o concorrente</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) A severidade com a detecção</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. A primeira opção na ordem de prioridade de controle é:</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Treinamento</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Advertência no manual</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Projeto e fabricação inerentemente seguros</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Inspeção final</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Um alarme de oclusão é:</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Projeto inerentemente seguro</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Medida de proteção no dispositivo</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Informação para segurança</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Treinamento</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. A verificação exigida em 7.2 cobre:</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Só a implementação</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Só a eficácia</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Implementação e eficácia</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Nenhuma das duas</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. O NPR de um FMEA:</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) É o risco da <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971</a></span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Não substitui os critérios de aceitabilidade do plano</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) É exigido pela norma</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Define a severidade</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. A análise por árvore de falhas (FTA) é:</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Indutiva</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Dedutiva</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Um ensaio de produto</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Exclusiva de IVD</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. A análise benefício-risco de 7.4 é feita quando:</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Sempre, antes da estimativa</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) O risco residual não é aceitável e controle adicional não é praticável</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) O NPR é maior que 100</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) O produto é classe I</span></p><p style=\"margin-top:10.9px;margin-bottom:8.2px;line-height:1.44\">< /* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||p.get("cuser_name")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";
  if(!HSC.boot()) return;
  document.body.classList.toggle("prof",PROF);
  $("#heroPh").style.backgroundImage=`url(${ASSETS.heroFoto})`;
  $("#logo").src=ASSETS.logoWhite; $("#flogo").src=ASSETS.logoNavy; if(ASSETS.mdsap){$("#s1").src=ASSETS.mdsap; $("#s2").src=ASSETS.exemplar;}else{document.querySelectorAll(".seals").forEach(x=>x.style.display="none");}
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno"; $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
})();
