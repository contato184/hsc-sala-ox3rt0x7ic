:root{
  --navy:#001372; --navy-2:#000B4A; --night:#060B2E; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#C3C8D2; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#001372; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido — HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

body{background:#F4F6FC;color:var(--ink)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy-2) 0%,var(--navy) 100%);color:#fff;padding:24px 0 34px}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:min(46%,760px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.hero .wrapc{position:relative}
.wrapc{max-width:1120px;margin:0 auto;padding:0 20px}
.hero .bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero .bar img{height:22px}
.hero .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.hero .bar span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero .bar .badge{margin-left:auto;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.hero .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;font-weight:600;margin:10px 0 6px;line-height:1.15}
.hero .sub{font-size:18px;opacity:.9}
.hero .seals{display:flex;gap:14px;margin-top:18px;align-items:center}
.hero .seals img{height:58px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding:24px 0 70px}
.toc{position:sticky;top:14px;align-self:start;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:12px;max-height:calc(100vh - 28px);overflow:auto}
.toc h4{margin:4px 8px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.toc a:hover{background:var(--ice)}
.toc a.on{background:var(--navy);color:#fff}
.toc a b{font-size:11px;min-width:26px;color:var(--accent)}
.toc a.on b{color:#9DB1FF}
.toc a .dn{margin-left:auto;color:var(--ok);font-size:12px}
.page{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:30px 36px;min-width:0}
.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.prof .opt{cursor:default}
.navx{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 30px;line-height:1.6}
footer img{height:18px;display:block;margin:0 auto 8px}
@media (max-width:860px){ .layout{grid-template-columns:1fr} .toc{position:static;max-height:none} .page{padding:20px 16px} .hero h1{font-size:25px} }
.footbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:30;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body{padding-bottom:44px}
.wm{bottom:7px!important}

>Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Situação hipotética: a Ortovia Implantes (empresa fictícia) conduz no Brasil um estudo multicêntrico da cúpula impressa do ARCA-H, Classe IV, ainda não regularizado, com coordenação de um parceiro no exterior. O dossiê de investigação (DICD) foi protocolado na Anvisa em 10/02, sem manifestação contrária até 15/05. Centro A (coordenador): parecer do CEP em 20/04, primeira cirurgia do estudo em 20/05. Centro B: parecer do CEP em 25/05, primeira cirurgia em 18/05. Centro C: parecer em 22/05, primeira cirurgia em 30/05, com o participante assinando a versão 1 do TCLE, quando o CEP havia aprovado a versão 2.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Antes da primeira inclusão, quais aprovações o arquivo do estudo precisa mostrar no Brasil para o ARCA-H? Indique a base.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Em qual centro a inclusão foi válida? Justifique para os três centros.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Pela coordenação no exterior, o protocolo poderia ficar só no CEP? O que o avaliador procura no arquivo?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. O Centro C recebeu pendência do CEP antes do parecer. Em que prazo ela deveria ter sido respondida?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Parecer do CEP de cada centro (<a class=\"hot\" data-refs=\"lei-14874\">Lei 14.874/2024</a>, art. 14, até 30 dias úteis) e, por ser Classe IV não regularizado, o DICD com manifestação da Anvisa ou decurso do prazo de 90 dias corridos (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, arts. 4º e 8º).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Só no Centro A: cirurgia após o parecer do próprio CEP e após o prazo da Anvisa. No Centro B a cirurgia é anterior ao parecer (achado grave; dados do centro comprometidos). No Centro C a data está correta, mas o TCLE assinado não é a versão aprovada (falha de consentimento; reconsentir na versão vigente e documentar).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não. Pesquisa com coordenação estrangeira é área temática especial e segue também para a instância nacional (CONEP), conforme a regulamentação da <a class=\"hot\" data-refs=\"lei-14874\">Lei 14.874/2024</a>. O avaliador procura o parecer da instância nacional datado antes da primeira inclusão.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Em 10 dias úteis, prorrogáveis (<a class=\"hot\" data-refs=\"lei-14874\">Lei 14.874/2024</a>, art. 14). O arquivo deve mostrar a pendência, a resposta ponto a ponto e o novo parecer.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"lei-14874\">Lei 14.874/2024</a>, art. 14; <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, arts. 4º e 8º; <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "iso-14155", "lei-14874"]}, {"id": "s2", "kicker": "E2  BLOCO 2: PAPÉIS E DOCUMENTOS", "title": "Achados de monitoria: de quem é a falha?", "ex": "E2", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E2  BLOCO 2: PAPÉIS E DOCUMENTOS</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Achados de monitoria: de quem é a falha?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Atribuir cada achado ao responsável definido pela <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a> e indicar o requisito não atendido.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Situação hipotética: numa visita de monitoria ao estudo da cúpula do ARCA-H, da Ortovia (empresa fictícia), o monitor apontou cinco achados. (1) O Centro B usa a versão 2 da brochura do investigador, embora a versão 3, com nova informação de segurança, tenha sido emitida há dois meses. (2) Uma tomografia exigida só pelo estudo foi feita um dia antes da assinatura do TCLE. (3) Um participante com IMC acima do limite de inclusão entrou no estudo por decisão do investigador, sem emenda. (4) O CIP justifica a amostra com um desvio-padrão sem fonte; a equipe informa que veio de estudos com cúpulas de spray de plasma. (5) A Ortovia contratou uma empresa para a monitoria, que deixou de visitar um centro por quatro meses.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Para os achados 1 e 2, quem responde e qual requisito falhou?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Como o achado 3 deveria ter sido tratado segundo a edição de 2026?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. O que falta no achado 4 para o tamanho da amostra ter sustentação?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. No achado 5, a responsabilidade pela falha de monitoria é da empresa contratada?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Achado 1: patrocinador, que deve atualizar a IB a cada informação nova e relevante de segurança e garantir sua distribuição (<a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, Anexo B); o investigador deve confirmar o recebimento. Achado 2: investigador principal, que deve obter o consentimento antes de qualquer procedimento específico do estudo; é falha grave.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Não poderia ter sido incluído. Na <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, exceção a critério de elegibilidade só é possível por emenda ao CIP, aprovada antes; trata-se de desvio a documentar e analisar.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. A origem justificada de cada parâmetro: hipótese e margem fixadas antes, alfa, poder e variabilidade do desfecho. Uma variabilidade de cúpulas de spray de plasma precisa de justificativa de aplicabilidade à cúpula impressa (<a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, Anexo A).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Não. O patrocinador pode delegar tarefas, mas não a responsabilidade: a Ortovia responde pelo estudo e deveria supervisionar a contratada (<a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, responsabilidades do patrocinador).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, Anexos A e B, responsabilidades do patrocinador e do investigador.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["iso-14155"]}, {"id": "s3", "kicker": "E3  BLOCO 2: SEGURANÇA E DADOS", "title": "Classifique e confira o prazo", "ex": "E3", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E3  BLOCO 2: SEGURANÇA E DADOS</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Classifique e confira o prazo</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Classificar eventos adversos pela <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a> e conferir os prazos de notificação no Brasil, na UE e nos EUA.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Situação hipotética: no estudo da cúpula do ARCA-H, da Ortovia (empresa fictícia), com centros no Brasil, na UE e nos EUA, ocorreram três eventos. (a) Luxação da prótese no 10º dia de pós-operatório, tratada com redução fechada, sem internação prolongada. (b) Soltura da cúpula aos 8 meses, com cirurgia de revisão; a soltura não constava da análise de risco nem da brochura. (c) Óbito por embolia pulmonar no 5º dia de pós-operatório. O investigador soube do evento (b) numa consulta de rotina.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Classifique os eventos (a), (b) e (c) e diga o que ainda precisa ser analisado em cada um.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. No Brasil, quais os prazos do investigador ao patrocinador e do patrocinador à Anvisa para (b) e (c)?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Na UE e nos EUA, qual o prazo do patrocinador para o evento (b)?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Para o evento (b), que dados de rastreabilidade do dispositivo o avaliador espera encontrar?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. (a) AE; a relação com o dispositivo ou o procedimento precisa ser analisada (se relacionada, ADE). (b) SADE e, por não estar prevista na análise de risco e na IB, USADE. (c) SAE (óbito); a relação com o dispositivo ou o procedimento precisa ser avaliada (<a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, definições e Anexo F).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Investigador ao patrocinador em até 24 horas (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, art. 62). Patrocinador à Anvisa: 7 dias corridos para óbito ou ameaça à vida (art. 63), e 15 dias corridos para os demais eventos graves inesperados (art. 64). Os prazos contam da ciência do evento.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. UE: imediatamente e em até 2 dias corridos se houver risco iminente, ou até 7 dias corridos nos demais casos notificáveis (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 80; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2020-10/1</a>). EUA: efeito adverso não antecipado em até 10 dias úteis (<a class=\"hot\" data-refs=\"cfr-812\">21 CFR 812.150</a>).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Lote e número de série da cúpula ligados ao participante no CRF, data de implante, anotação de recebimento e uso na contabilidade do dispositivo e guarda do componente explantado, quando aplicável (<a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>; <a class=\"hot\" data-refs=\"cfr-812\">21 CFR 812.140</a>).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>, Anexo F; <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 837/2023</a>, arts. 62 a 64; <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 80; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2020-10/1</a>; <a class=\"hot\" data-refs=\"cfr-812\">21 CFR 812.150</a>.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "cfr-812", "eu-mdr", "iso-14155", "mdcg"]}, {"id": "s4", "kicker": "E4  BLOCO 3: BASE PRÉ-CLÍNICA", "title": "A bancada da cúpula responde à pergunta certa?", "ex": "E4", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E4  BLOCO 3: BASE PRÉ-CLÍNICA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">A bancada da cúpula responde à pergunta certa?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla   10 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Verificar se cada relatório pré-clínico representa o dispositivo final e o uso real.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Situação hipotética: o dossiê técnico do ARCA-H, da Ortovia (empresa fictícia), traz quatro relatórios. (1) Citotoxicidade (<a class=\"hot\" data-refs=\"iso-10993\">ISO 10993-5</a>) feita em corpo de prova de pó de titânio, antes da impressão e sem esterilização. (2) Fadiga da haste (série <a class=\"hot\" data-refs=\"iso-7206\">ISO 7206</a>) no comprimento de colo da ARCA-1. (3) Ensaio de partículas e de resíduo de pó na cúpula impressa final, limpa e esterilizada, em laboratório com competência demonstrada pela ISO/IEC 17025. (4) Declaração justificada de que a série IEC 60601 não se aplica.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Quais relatórios o avaliador aceita como evidência do ARCA-H? Justifique cada um.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Que critério orienta a escolha dos ensaios biológicos da cúpula?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Mesmo com todos os ensaios aceitos, o que a bancada não responde sobre a cúpula?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. (1) Não: o material isolado, antes da impressão e da esterilização, não representa o dispositivo final. (2) Não: o colo mudou; a fadiga deve ser ensaiada no novo comprimento. (3) Sim: peça final, esterilizada, laboratório competente. (4) Sim: o ARCA-H não é equipamento eletromédico, e a justificativa documentada basta.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. A natureza e a duração do contato com o corpo, dentro da gestão de risco (<a class=\"hot\" data-refs=\"iso-10993\">ISO 10993-1</a>, <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971</a>). A nova superfície impressa em contato prolongado com o osso pede avaliação biológica própria.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Como o osso vai se integrar à cúpula e qual a sobrevida do implante ao longo dos anos: isso só dados clínicos respondem.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"iso-10993\">ISO 10993-1</a> e -5; <a class=\"hot\" data-refs=\"iso-7206\">ISO 7206</a> (série); ISO/IEC 17025:2017; <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971:2019</a>.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["iso-10993", "iso-14971", "iso-7206"]}, {"id": "s5", "kicker": "E5  BLOCO 4: ESTRATÉGIA E EQUIVALÊNCIA", "title": "Dados existentes ou novo estudo?", "ex": "E5", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E5  BLOCO 4: ESTRATÉGIA E EQUIVALÊNCIA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Dados existentes ou novo estudo?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Pesar risco, novidade, literatura e equivalência para decidir, por componente, se os dados existentes bastam.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A Ortovia (empresa fictícia) afirma que não precisa de estudo próprio para o ARCA-H: a ARCA-1 está há anos no mercado brasileiro, e há boa literatura sobre cúpulas impressas de outros fabricantes. O ARCA-H é implantável, Classe IV no Brasil (<a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Regra 8) e Classe III na UE (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo VIII, Regra 8). A haste muda só no comprimento do colo; a cúpula tem nova estrutura porosa feita por manufatura aditiva.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Pelo <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, qual a regra geral para investigação clínica de um dispositivo como o ARCA-H?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Como você classifica a novidade da haste e da cúpula, e o que isso muda na exigência de dados?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. A literatura sobre cúpulas impressas de outros fabricantes basta para a cúpula do ARCA-H?</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Implantáveis e Classe III exigem investigação clínica, salvo as exceções do próprio art. 61 (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61(4) a 61(6)); uma delas depende de equivalência demonstrada com dispositivo do mesmo fabricante.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Haste: novidade incremental; dados da ARCA-1 podem bastar, se a equivalência se sustentar. Cúpula: novidade significativa (nova superfície e novo processo); dados da ARCA-1 só valem com equivalência demonstrada, a testar nos três pilares (<a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Não por si só: a literatura precisa ser suficiente e aplicável ao dispositivo avaliado. Dados de outro fabricante não são do ARCA-H e só valeriam com equivalência demonstrada, o que exige acesso à documentação técnica (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte A; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2020-5</a>).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61(4) a 61(6) e Anexo XIV, Parte A; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2020-5</a>.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["anvisa-legis", "eu-mdr", "mdcg", "meddev"]}, {"id": "s6", "kicker": "E6  BLOCO 4: ESTRATÉGIA E EQUIVALÊNCIA", "title": "Um relatório que alega equivalência", "ex": "E6", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E6  BLOCO 4: ESTRATÉGIA E EQUIVALÊNCIA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Um relatório que alega equivalência</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Grupo   15 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Testar a equivalência nos três pilares, por componente, e reconhecer sinais de alerta num relatório de avaliação clínica.</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Trechos de um relatório hipotético do ARCA-H, da Ortovia (empresa fictícia): 'O ARCA-H é equivalente à ARCA-1, pois tem os mesmos materiais e a mesma indicação. A cúpula apresenta melhorias de superfície que não alteram o desempenho.' A busca de literatura foi feita só no PubMed, por uma pessoa, sem critérios escritos. Nenhum estudo com resultado desfavorável foi incluído. O benefício-risco é descrito como 'favorável'.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Teste os três pilares para a haste e para a cúpula. A equivalência se sustenta?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Que sinais de alerta o avaliador aponta no relatório, sem depender de opinião?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Formule, em uma frase, a lacuna de evidência que segue para o Módulo 3.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Haste: técnico (mesmo projeto, colo coberto por ensaios), biológico (mesmos materiais e superfície) e clínico (mesmo uso pretendido) se sustentam. Cúpula: técnico e biológico não se sustentam (porosidade, geometria, superfície e processo diferentes agem na fixação); o clínico coincide, mas não compensa. 'Melhoria de superfície' é diferença que exige demonstração, não afirmação (<a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte A, item 3; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2020-5</a>).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Equivalência alegada sem demonstração nos três pilares; busca sem método reprodutível (uma base, um revisor, sem critérios); literatura seletiva, sem dados desfavoráveis; benefício-risco vago, sem quantificação nem riscos residuais.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Faltam dados clínicos de segurança e desempenho da nova superfície porosa impressa da cúpula do ARCA-H, incluindo fixação ao osso e sobrevida do implante ao longo do tempo.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, Anexo XIV, Parte A; <a class=\"hot\" data-refs=\"mdcg\">MDCG 2020-5</a>; <a class=\"hot\" data-refs=\"meddev\">MEDDEV 2.7/1 Rev. 4</a>, Anexos A1 e A9.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>", "refs": ["eu-mdr", "mdcg", "meddev"]}, {"id": "s7", "kicker": "Q  FECHAMENTO", "title": "Avaliação objetiva: 10 questões", "ex": "Q", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">Q  FECHAMENTO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação objetiva: 10 questões</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Marque uma alternativa por questão. Cada questão indica onde conferir a resposta no documento oficial.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Qual norma rege os estudos de desempenho clínico de dispositivos para diagnóstico in vitro, excluídos do escopo da <a class=\"hot\" data-refs=\"iso-14155\">ISO 14155:2026</a>?</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) <a class=\"hot\" data-refs=\"iso-14971\">ISO 14971</a></span></p><p class=\"opt opt-ok\" data-q=\"gab:q1\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) <a class=\"hot\" data-refs=\"iso-20916\">ISO 20916</a></span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) <a class=\"hot\" data-refs=\"iso-10993\">ISO 10993-1</a></span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a></span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Pela <a class=\"hot\" data-refs=\"lei-14874\">Lei 14.874/2024</a>, qual o prazo do CEP para emitir parecer?</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Até 10 dias úteis</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Até 60 dias corridos</span></p><p class=\"opt opt-ok\" data-q=\"gab:q2\" data-o=\"c\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Até 30 dias úteis</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Até 90 dias corridos</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Para um dispositivo Classe IV ainda não regularizado, qual o prazo da Anvisa para se manifestar sobre o DICD?</span></p><p class=\"opt opt-ok\" data-q=\"gab:q3\" data-o=\"a\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Até 90 dias corridos</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Até 30 dias úteis</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Até 45 dias após validação</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) 30 dias após o recebimento</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. O patrocinador contratou uma empresa para a monitoria. Quem responde pelo estudo?</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) A empresa contratada</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) O investigador principal</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) O CEP do centro coordenador</span></p><p class=\"opt opt-ok\" data-q=\"gab:q4\" data-o=\"d\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) O patrocinador</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. Um efeito adverso grave do dispositivo, cuja natureza não estava prevista na brochura nem na análise de risco, é classificado como:</span></p><p class=\"opt opt-ok\" data-q=\"gab:q5\" data-o=\"a\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) USADE</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) ADE</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) SAE</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) DD</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. No Brasil, em que prazo o patrocinador notifica a Anvisa de um evento com óbito?</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) 24 horas</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) 2 dias corridos</span></p><p class=\"opt opt-ok\" data-q=\"gab:q6\" data-o=\"c\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) 7 dias corridos</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) 15 dias corridos</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. Pelo <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, por quanto tempo, no mínimo, a documentação de investigação de um dispositivo implantável é mantida?</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) 5 anos</span></p><p class=\"opt opt-ok\" data-q=\"gab:q7\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) 15 anos</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) 10 anos</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) 2 anos</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. Um ensaio de citotoxicidade feito no pó de titânio, antes da impressão e da esterilização, é evidência suficiente da cúpula final?</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Sim, porque o material é o mesmo</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Sim, se o laboratório for acreditado</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Não, porque citotoxicidade não se aplica a implantes</span></p><p class=\"opt opt-ok\" data-q=\"gab:q8\" data-o=\"d\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Não, porque não representa o dispositivo final</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">9. Pelo <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>, art. 61(4), o que se exige de dispositivos implantáveis e de Classe III?</span></p><p class=\"opt opt-ok\" data-q=\"gab:q9\" data-o=\"a\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Investigação clínica, salvo as exceções do próprio artigo</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q9\" data-o=\"b\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Apenas revisão de literatura</span></p><p class=\"opt\" data-q=\"gab:q9\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Apenas PMCF após a certificação</span></p><p class=\"opt\" data-q=\"gab:q9\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Estudo de fase 3 com voluntários sadios</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">10. Dois dispositivos têm o mesmo projeto e os mesmos materiais, mas um é indicado para adultos e o outro para crianças. Quanto à equivalência:</span></p><p class=\"opt\" data-q=\"gab:q10\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) É equivalente, pois os pilares técnico e biológico coincidem</span></p><p class=\"opt opt-ok\" data-q=\"gab:q10\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Não é equivalente, pois o pilar clínico quebra</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q10\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) É equivalente se houver literatura sobre crianças</span></p><p class=\"opt\" data-q=\"gab:q10\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Depende só da classe de risco</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito da avaliação objetiva</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:11.41%\"><col style=\"width:51.88%\"><col style=\"width:36.71%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">QUESTÃO</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">RESPOSTA</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.4px solid #A8ADB7;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">REFERÊNCIA</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6p /* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||p.get("cuser_name")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";
  if(!HSC.boot()) return;
  document.body.classList.toggle("prof",PROF);
  $("#heroPh").style.backgroundImage=`url(${ASSETS.heroFoto})`;
  $("#logo").src=ASSETS.logoWhite; $("#flogo").src=ASSETS.logoNavy; 
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno"; $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
})();
