:root{
  --navy:#001372; --navy-2:#000B4A; --night:#060B2E; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#C3C8D2; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#001372; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido — HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

html,body{height:100%;overflow:hidden;background:var(--night)}
.top{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(90deg,var(--navy-2),var(--navy));color:#fff;z-index:20;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.top .logo{height:20px;display:block}
.top .sep{width:1px;height:22px;background:rgba(255,255,255,.25)}
.top .acad{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.course{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;font-size:13.5px}
.badge{font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.tb{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.12)}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
#timer{font-variant-numeric:tabular-nums}
.wrap{position:fixed;inset:52px 0 54px 0;display:flex;align-items:center;justify-content:center;padding:14px;transition:right .2s}
.wrap.with-side{right:390px}
.stage{position:relative;aspect-ratio:16/9;width:min(100%, calc((100vh - 134px) * 16/9));background:#fff;border-radius:8px;
  box-shadow:0 14px 50px rgba(0,0,0,.55);overflow:hidden}
#vp{position:absolute;left:0;top:0;width:1280px;height:720px;container-type:inline-size;transform-origin:0 0;transform:scale(var(--k,1))}
.slide{position:absolute;inset:0;display:none}
.slide.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide{background-size:cover;background-position:center}
.pe{position:absolute;box-sizing:border-box;margin:0}
.tx{display:flex;flex-direction:column;line-height:1.2;overflow-wrap:break-word}
.tx p{margin:0;white-space:pre-wrap}
img.pe{object-fit:fill;pointer-events:none}
table.tb{border-collapse:collapse;table-layout:fixed;line-height:1.2}
table.tb td p{margin:0;white-space:pre-wrap}
.stage .hot{color:inherit;font-weight:inherit;border-bottom:none;cursor:pointer;border-radius:.3cqw;transition:background .15s}
.stage.show-hot .hot{background:rgba(74,108,247,.13);box-shadow:0 0 0 .25cqw rgba(74,108,247,.13);text-decoration:underline dashed rgba(74,108,247,.9);text-underline-offset:.35cqw}
.stage.show-hot .hot::after{content:"↗";font-size:.75em;margin-left:.15em;color:var(--accent);font-weight:700}
.stage .hot:hover{background:rgba(74,108,247,.28)}
.th .mini{position:absolute;left:0;top:0;width:1000px;height:562.5px;container-type:inline-size;pointer-events:none;transform-origin:0 0;transform:scale(var(--s,.2))}
.th .mini .slide{display:block}
.th .mini .hot::after{content:none}
.swm{position:absolute;right:5.5%;bottom:1.7%;font-size:.62cqw;line-height:1;letter-spacing:.02em;color:rgba(110,116,128,.8);white-space:nowrap;pointer-events:none;user-select:none}
.swm.dk{color:rgba(255,255,255,.55)}
/* chip de exercício sobre o slide */
.exchips{position:absolute;right:1.6cqw;top:1.6cqw;display:flex;gap:.8cqw;z-index:3}
.exchip{background:var(--navy);color:#fff;border:0;border-radius:3cqw;padding:.7cqw 1.4cqw;font-size:max(11px,1.15cqw);font-weight:600;cursor:pointer;
  box-shadow:0 .5cqw 1.5cqw rgba(0,19,114,.35);display:flex;align-items:center;gap:.6cqw}
.exchip:hover{background:var(--accent)}
.exchip i{font-style:normal;background:var(--accent);border-radius:2cqw;padding:.1cqw .6cqw}
.bottom{position:fixed;inset:auto 0 0 0;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--navy-2);color:#fff;z-index:20;font-size:13px;border-top:1px solid rgba(255,255,255,.08)}
.progress{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;min-width:40px;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width .2s}
.progress b{position:absolute;left:0;top:0;bottom:0;background:rgba(74,108,247,.35);width:0}
#count{font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
#code{opacity:.6;white-space:nowrap;font-size:12px}
.has-bar .bottom{padding-right:var(--wmw,420px)}
@media (max-width:700px){ .has-bar .bottom{padding-right:14px;bottom:30px} .has-bar .wm{bottom:4px;font-size:10px} }
.side{position:fixed;top:52px;bottom:54px;right:0;width:390px;background:var(--panel);color:var(--panel-ink);z-index:15;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.side.open{transform:none}
.side header{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.side header button{flex:1;background:transparent;color:var(--panel-ink);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:7px 4px;cursor:pointer;font-size:12.5px}
.side header button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sbody{padding:14px 16px;overflow:auto;font-size:15px;line-height:1.6;flex:1}
.sbody h4{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:600}
.sbody h4:first-child{margin-top:0}
.sbody p{margin:0 0 10px}
.sbody .hot{color:#9DB1FF}
.sbody .ref{background:rgba(255,255,255,.06)}
.sbody textarea{width:100%;min-height:220px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;padding:10px;font-size:14px;line-height:1.5}
.filter{width:100%;padding:8px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;margin-bottom:10px;font-size:13px}
.exitem{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.exitem:hover{border-color:var(--accent)}
.exitem b{background:var(--accent);border-radius:6px;padding:4px 7px;font-size:12px}
.exitem small{display:block;opacity:.7;font-size:12px}
.grid{position:fixed;inset:52px 0 54px 0;background:rgba(3,6,30,.97);z-index:18;display:none;overflow:auto;padding:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-content:start}
.grid.open{display:grid}
.th{position:relative;cursor:pointer;border:3px solid transparent;border-radius:6px;overflow:hidden;background:#fff;aspect-ratio:16/9}
.th.cur{border-color:var(--accent)}
.th .num{position:absolute;left:6px;bottom:6px;background:rgba(0,19,114,.88);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.th.seen::after{content:"✓";position:absolute;right:6px;top:6px;background:var(--ok);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center}
@media (max-width:980px){ .course,#code,.acad,.sep{display:none} }
@media (max-width:900px){ .side{width:100%} .wrap.with-side{right:0} }
</style>

x solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Transformar uma solicitação incompleta e contraditória em um prompt PACOTE para uma análise de enquadramento com a regra citada e escrever o prompt que audita a resposta da IA. Rubrica de 10 pontos: lacunas (2), contradições (2), seis componentes rotulados (2), contexto completo (1), travas anti-alucinação (2), auditoria com localização na fonte (1).</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">E-mail fictício recebido da diretoria da NeoCirúrgica Ltda. (assunto: regularização da tela NeoMesh, urgente): \"Precisamos regularizar nossa tela cirúrgica NeoMesh Colágeno o quanto antes. Tela de polipropileno monofilamentar com revestimento de colágeno de origem bovina. Indicação: correção de hérnia de parede abdominal. Produto não implantável, de uso cirúrgico. Permanece no paciente por tempo indeterminado após a cirurgia. Fabricante na Alemanha, já com marcação CE, classificado como Classe IIb pelo <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a>. Como já é Classe IIb na Europa, entendo que aqui também será Classe II, correto? Já temos o dossiê europeu traduzido. Podemos protocolar essa semana?\"</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Etapa 1 (8 min): liste ao menos seis informações que faltam para enquadrar e classificar o produto com segurança.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Etapa 1: identifique as duas contradições da solicitação e explique por que cada uma compromete o enquadramento.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Etapa 2 (14 min): escreva o prompt completo pelo método PACOTE, rotulando Papel, Alvo, Contexto, Output, Tom e travas e Exemplo. Diga como a IA deve tratar dado que você não tem.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Etapa 3 (8 min): escreva o prompt de auditoria, o segundo turno que obriga a IA a criticar a própria resposta contra a norma anexa.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. Exemplos aceitáveis: se o colágeno é absorvível e em quanto tempo; origem, tratamento e controle de risco do material bovino; método de esterilização; detentor da regularização no Brasil e AFE do importador; modelos e dimensões; contato e local exato; finalidade completa e população; usuário e ambiente de uso; existência de certificado de BPF; documentos do fabricante legal. Seis ou mais com relevância: 2 pontos.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. (1) \"Não implantável\" e \"permanece no paciente por tempo indeterminado após a cirurgia\": pela definição (Art. 4º, XIV), o produto é implantável, e isso muda a regra aplicável. (2) Usar a classe do <a class=\"hot\" data-refs=\"eu-mdr\">MDR</a> como fundamento da classe brasileira: a classificação no Brasil segue o Anexo I da <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>. Atenção: pela <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, telas cirúrgicas são Classe IV (Regra 8, alínea g), e produto fabricado com tecido animal não viável é Classe IV (Regra 18). A expectativa de Classe II está errada.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Critérios: os seis componentes rotulados; Contexto com uso pretendido, material, permanência e a <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a> anexa; travas explícitas: responder só com base no anexo, marcar [CONFIRMAR] em dado não fornecido, não usar classificação estrangeira como fundamento, não inventar artigo.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. O prompt de auditoria deve exigir: localizar cada afirmação normativa no texto anexo ou marcá-la como não localizada; nomear a regra aplicada e justificar as descartadas; marcar todo dado não fornecido; listar o que falta saber para aumentar a confiança.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC Anvisa 751/2022</a>, Art. 4º, XIV; Arts. 8º e 9º; Anexo I, Regras 8 e 18.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>"}, {"id": "E2", "titulo": "Arquitetura: assistente, automação ou híbrido", "bloco": "P2", "modo": "Dupla ou trio, 30 min", "deck": "Parte 2, slide 6", "parte": 2, "slide": 6, "comp": false, "slides": [6], "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E2  WORKSHOP: EXERCÍCIO 2</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Arquitetura: assistente, automação ou híbrido</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla ou trio   30 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Escolher a tecnologia certa para cada demanda e desenhar um fluxo híbrido auditável, com parada obrigatória do responsável técnico. Rubrica: classificação justificada (3), prazo fora da IA (1), parada do RT na resposta sobre regime (1), fluxo completo (2), separação determinístico x julgamento (1), dois modos de falha com controle (2).</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A NeoCirúrgica precisa adequar 60 dispositivos à <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>. Classifique cada demanda como A (automação), B (assistente de IA) ou H (híbrido). 1: calcular a data-limite de adequação de cada uma das 60 regularizações e priorizar a fila por prazo. 2: comparar a instrução de uso vigente de cada produto contra os requisitos de instruções de uso da <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a> e apontar lacunas. 3: analisar o enquadramento de um produto novo e indicar a regra aplicável. 4: extrair de 60 artes de rótulo em PDF os campos nome técnico, modelo, fabricante, classe e número de processo. 5: renomear e arquivar os 60 arquivos de instrução de uso conforme a convenção interna. 6: informar à diretoria se determinado produto segue notificação ou o regime das Classes III e IV. 7: gerar o relatório mensal de status de peticionamento a partir da planilha. 8: identificar, a cada publicação de norma no DOU, quais produtos do portfólio são afetados.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Etapa 1 (10 min): classifique as oito demandas (A, B ou H) e justifique cada uma em uma frase.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Etapa 2 (15 min): escolha uma demanda híbrida e desenhe o fluxo em cinco etapas (gatilho, coleta, análise, revisão, ação e registro), com dono e natureza de cada uma.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Etapa 2: qual etapa não avança sem a assinatura do responsável técnico, e por quê?</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Etapa 3 (5 min): aponte dois modos de falha do fluxo, como você os perceberia e o controle que neutraliza cada um.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. 1 A (prazo e prioridade são regra; nunca na camada de IA). 2 H (IA compara e aponta lacunas com o trecho; RT valida). 3 B com revisão do RT (assistente com template). 4 H (automação com extração por IA e conferência por amostragem). 5 A (convenção de nomes é regra). 6 B com parada obrigatória do RT (parece simples, mas é julgamento com consequência regulatória). 7 A. 8 H (gatilho determinístico na publicação; IA triagem; RT decide impacto). Divergência bem fundamentada pontua.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Exemplo para a demanda 2: gatilho determinístico (novo ciclo de revisão); coleta determinística (pasta das instruções e lista de requisitos dos Arts. 46 a 48); análise pela IA (lacunas com trecho); revisão humana pelo RT; ação e registro determinísticos (planilha, versão, data, responsável).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. A revisão: nenhuma lacuna vira petição nem resposta à diretoria sem a validação e a assinatura do RT, porque a responsabilidade pelas informações é dos responsáveis técnico e legal (Art. 55).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4. Exemplos: IA aponta requisito que não existe (percebe na revisão; controle: exigir o trecho da norma em cada apontamento); arquivo de versão errada entra na coleta (percebe pela divergência de versão; controle: lista mestra com versão vigente); falha de prazo (controle: cálculo só na camada determinística).</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC Anvisa 751/2022</a>, Arts. 46 a 48 e 55.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>"}, {"id": "E3", "titulo": "Auditoria de uma análise de enquadramento gerada por IA", "bloco": "P2", "modo": "Dupla ou trio, 30 min", "deck": "Parte 2, slide 7", "parte": 2, "slide": 7, "comp": false, "slides": [7], "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">E3  WORKSHOP: EXERCÍCIO 3</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Auditoria de uma análise de enquadramento gerada por IA</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:24.90%\"><col style=\"width:75.10%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Modo e tempo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Dupla ou trio   30 min</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:12.9px;color:#001372\">Objetivo</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"\"><img data-img=\"9b5c8d5b3f\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span><span style=\"font-weight:400;font-size:12.9px;color:#171717\">Encontrar o que a fluência esconde. Rubrica: seis ou mais defeitos (3), tipo correto (1), um defeito de governança (1), criticidade coerente (1), camada do controle (2), cláusula imperativa e verificável (2).</span><span style=\"\"><img data-img=\"9605b03857\" style=\"width:14px;height:14px;vertical-align:-3px\" alt=\"\"></span></p></td></tr></table></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Cenário</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Documento fictício com erros propositais. ANÁLISE DE ENQUADRAMENTO AE-2025-047 (gerada por IA), tela cirúrgica NeoMesh Colágeno, solicitante NeoCirúrgica Ltda. 1. Do produto: polipropileno monofilamentar com revestimento de colágeno de origem bovina, para hérnias de parede abdominal; fornecido estéril, em embalagem unitária, armazenar entre 15 °C e 25 °C, umidade relativa inferior a 60%. 2. Do enquadramento: dispositivo médico nos termos da <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>; já possui marcação CE, o que atesta o atendimento aos requisitos essenciais e dispensa estudo adicional à Anvisa. 3. Da classificação: Classe III; conforme o art. 27, § 2º, da <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Classe III sujeita-se ao regime de registro, com validade de 10 anos, renovável. 4. Da rotulagem: observará a <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 185/2001</a>, que permanece vigente para implantáveis. 5. Do prazo: protocolo previsto para 12/03/2025 e prazo regulatório de 90 dias corridos; decisão esperada até 12/07/2025. 6. Do contato: Sr. João Carlos Meireles, CPF 123.456.789-00, telefone (31) 98888-7777. Tipos possíveis: alucinação normativa, norma revogada, requisito estrangeiro importado, classificação sem fundamento, dado preenchido, erro de cálculo, risco de dado pessoal, falha de governança documental.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Perguntas</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Etapa 1 (12 min): localize os oito defeitos e registre o trecho, o tipo e a criticidade (alta, média ou baixa).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. Etapa 2 (10 min): para cada defeito, indique a camada da falha (prompt, verificação, fluxo ou política) e o controle específico que o teria evitado.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. Etapa 3 (8 min): escolha o defeito de maior criticidade e escreva, em até dez linhas, a cláusula de política interna de uso de IA que fecha esse risco, de forma imperativa e verificável.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Gabarito</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1. (1) Seção 3: \"art. 27, § 2º\" para a validade de 10 anos: alucinação normativa (a validade de 10 anos da regularização das Classes III e IV está no Art. 11; o Art. 27 trata da revalidação). Alta. (2) Seção 4: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 185/2001</a> como vigente: norma revogada (Art. 66). Alta. (3) Seção 2: marcação CE dispensa estudo: requisito estrangeiro importado. Alta. (4) Seção 3: Classe III sem regra: classificação sem fundamento; além disso, errada: telas cirúrgicas e produtos com tecido animal não viável são Classe IV (Regras 8, g, e 18). Alta. (5) Seção 1: condições de armazenamento que ninguém forneceu: dado preenchido. Média. (6) Seção 5: \"prazo de 90 dias\" sem base indicada e conta errada (12/03/2025 + 90 dias = 10/06/2025): erro de cálculo. Média. (7) Seção 6: CPF e telefone de pessoa física: risco de dado pessoal (<a class=\"hot\" data-refs=\"lgpd\">LGPD</a>). Alta. (8) Ausência de responsável técnico, data e versão: falha de governança documental. Média ou alta.</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2. Referência: 1, 2 e 4 verificação (conferir no texto oficial) e prompt (ancoragem e exigência da regra); 3 prompt (vedar fundamento estrangeiro); 5 prompt (marcar [CONFIRMAR]); 6 fluxo (prazo calculado na camada determinística); 7 política (dado pessoal não entra no prompt nem no documento); 8 fluxo e política (modelo de documento com RT, data e versão; registro de revisão).</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3. Exemplo: \"É vedado usar em petição ou enviar à diretoria análise com apoio de IA sem que cada referência normativa tenha sido conferida no texto oficial vigente. O revisor registra, na lista de conferência da análise, o artigo e a data da consulta de cada referência. O responsável técnico assina a lista antes da emissão. A qualidade audita trimestralmente uma amostra de análises.\" Critérios: imperativa, a quem se aplica, evidência, quem verifica.</span></p><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC Anvisa 751/2022</a>, Arts. 11, 27, 55 e 66; Anexo I, Regras 8 e 18; <a class=\"hot\" data-refs=\"lgpd\">Lei 13.709/2018</a>.</span></p><p class=\"emp\" style=\";\">&nbsp;</p>"}, {"id": "Q", "titulo": "Avaliação objetiva: 10 questões", "bloco": "Fech.", "modo": "Individual, 10 min", "deck": "Parte 2, slide 9", "parte": 2, "slide": 9, "comp": false, "slides": [9], "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.72px\">Q  FECHAMENTO</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação objetiva: 10 questões</span></p><p style=\"margin-bottom:8.2px;line-height:1.44\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Marque uma alternativa por questão. Cada questão indica onde conferir a resposta no documento oficial.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. Um modelo de linguagem gera a resposta:</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Consultando o texto oficial da norma</span></p><p class=\"opt opt-ok\" data-q=\"gab:q1\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Prevendo a continuação mais provável do texto</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Calculando com regras fixas</span></p><p class=\"opt\" data-q=\"gab:q1\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Copiando a primeira fonte da internet</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. No método PACOTE, a letra T significa:</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Tabela</span></p><p class=\"opt opt-ok\" data-q=\"gab:q2\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Tom e travas</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Tempo</span></p><p class=\"opt\" data-q=\"gab:q2\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Tarefa</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. A técnica que mais reduz a invenção de referência normativa é:</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Pedir texto mais longo</span></p><p class=\"opt opt-ok\" data-q=\"gab:q3\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Ancoragem no texto anexo da norma</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Usar linguagem formal</span></p><p class=\"opt\" data-q=\"gab:q3\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Repetir a pergunta</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. Calcular a data-limite de adequação de 60 produtos é tarefa de:</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Assistente de IA</span></p><p class=\"opt opt-ok\" data-q=\"gab:q4\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Automação determinística</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Humano sem ferramenta</span></p><p class=\"opt\" data-q=\"gab:q4\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) IA com extração</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. O erro de um assistente de IA costuma ser:</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Visível, porque o fluxo para</span></p><p class=\"opt opt-ok\" data-q=\"gab:q5\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Silencioso, porque o texto errado parece certo</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Impossível com bom prompt</span></p><p class=\"opt\" data-q=\"gab:q5\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Sempre de cálculo</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. Em um fluxo orquestrado, a etapa de revisão é:</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Da IA</span></p><p class=\"opt opt-ok\" data-q=\"gab:q6\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Humana</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Determinística</span></p><p class=\"opt\" data-q=\"gab:q6\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Opcional</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. Quem responde pelas informações apresentadas à Anvisa?</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) A ferramenta de IA</span></p><p class=\"opt opt-ok\" data-q=\"gab:q7\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Os responsáveis legal e técnico</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) O fornecedor do software</span></p><p class=\"opt\" data-q=\"gab:q7\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Ninguém, se houver ressalva</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. Pela <a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, a validade de 10 anos da regularização das Classes III e IV está no:</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"a\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(a) Art. 27, § 2º</span></p><p class=\"opt opt-ok\" data-q=\"gab:q8\" data-o=\"b\" data-ok=\"1\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(b) Art. 11</span><span style=\"font-weight:700;font-size:14.3px;color:#171717\">   Correta</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"c\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(c) Art. 66</span></p><p class=\"opt\" data-q=\"gab:q8\" data-o=\"d\" style=\"margin-bottom:2.7px;padding-left:24.5px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">(d) Anexo II</span></p><p style=\"margin-top:10.9px;margin- "b\" style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">(b) Os responsáveis legal e técnico</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Art. 55</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">8</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p class=\"opt\" data-q=\"gab:q10\" data-o=\"b\" style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">(b) Art. 11</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa-legis\">RDC 751/2022</a>, Art. 11</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">9</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p class=\"opt\" data-q=\"gab:q10\" data-o=\"c\" style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">(c) IV</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Anexo I, Regra 8, g</span></p></td></tr><tr><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">10</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p class=\"opt\" data-q=\"gab:q10\" data-o=\"b\" style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">(b) Risco de dado pessoal que a política deve vedar</span></p></td><td colspan=\"1\" style=\"border-top:1.0px solid #999;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #999;border-right:1.0px solid #999;background:#F0F2FF;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"lgpd\">Lei 13.709/2018</a></span></p></td></tr></table></div><p style=\"margin-top:10.9px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"anvisa-legis\">RDC Anvisa 751/2022</a>; método HSC Academy.</span></p>"}];

/* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||p.get("cuser_name")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
